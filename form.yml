---
cluster: "ubelix"
attributes:
  bc_vnc_idle: 0
  bc_vnc_resolution:
    required: true
  node_type: null
  email:
    widget: "text_field"
    label: "Email"
    help: |
      Please provide a valid email address. Without this you will not receive a notification on start.
  email_on_start:
    widget: 'check_box'
    html_options:
      data:
        hide-email-when-unchecked: true
form:
  - bc_vnc_idle
  - bc_vnc_resolution
  - email_on_start
  - email
