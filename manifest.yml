description: |
  The limited demo version of the VIBE Desktop.

  This version does not offer GPU acceleration and is limited to 1 hour of use. It uses the 'gratis' account of Ubelix, so waiting time may occur.  
  You can use the 'Email On Start' option to receive a mail notification when your desktop session starts.

  Please get in touch with the VIBE team if you are interested in subscribing and want to test your work on the actual VIBE Desktop with GPU acceleration, more resources and longer session times.

  Support for VIBE is provided by the VIBE team at support.vibe@unibe.ch.

  Visit the [VIBE User Documentation](https://dsl-unibe-ch.github.io/vibe-documentation/) for more information.
